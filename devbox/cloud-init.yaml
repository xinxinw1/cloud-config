#cloud-config

# Update and upgrade all packages on first boot
package_update: true
package_upgrade: true

packages:
  - neovim

users:
  - default
  - name: xinxin
    gecos: xinxin
    shell: /bin/bash
    groups: [sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]

runcmd:
  # Give xinxin the same authorized_keys as root
  - mkdir -p /home/xinxin/.ssh
  - cp /root/.ssh/authorized_keys /home/xinxin/.ssh/authorized_keys
  - chown -R xinxin:xinxin /home/xinxin/.ssh
  - chmod 700 /home/xinxin/.ssh
  - chmod 600 /home/xinxin/.ssh/authorized_keys

  # Generate a 4096-bit RSA SSH key for xinxin (no passphrase)
  - sudo -u xinxin ssh-keygen -t rsa -b 4096 -f /home/xinxin/.ssh/id_rsa -N "" -C "xinxin@$(hostname)"

  # Install GitHub CLI (gh) via the official apt repo
  - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg
  - chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
  - apt-get update
  - apt-get install -y gh

  # Download and install the devbox files (setup.sh, etc.) from the
  # dotfiles repo. Re-running this script later picks up any updates.
  - sudo -u xinxin -H bash -c "curl -fsSL https://raw.githubusercontent.com/xinxinw1/dotfiles/main/install-dotfiles.sh | bash"

  - echo "Droplet bootstrap complete. SSH in as xinxin and run ~/setup.sh to finish GitHub setup and clone the repo." > /home/xinxin/BOOTSTRAP_DONE
  - chown xinxin:xinxin /home/xinxin/BOOTSTRAP_DONE

# Reboot automatically once cloud-init finishes, but only if the
# package upgrades actually left a restart pending
power_state:
  mode: reboot
  condition: test -f /var/run/reboot-required
  timeout: 60
